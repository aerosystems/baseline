name: Student reports

# The build is tied to accepting the work rather than to student pushes: the
# .docx is produced when a pull request is merged into the lab branch.
#
# paths is narrowed to report.md on purpose — the pipeline commits the .docx into
# that same branch, and without the filter it would retrigger itself.
on:
  push:
    branches:
      - 'lab/**'
    paths:
      - 'reports/**/report.md'

permissions:
  contents: write

jobs:
  build:
    name: Build .docx from reports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # history is needed: only changed reports are built

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build reports
        run: node scripts/build-report-docx.mjs --changed --since="${{ github.event.before }}"

      - name: Commit the documents
        run: |
          # Opening an assignment pushes nothing but stubs, and a stub builds
          # no document. A git add whose pattern matches no file is a fatal
          # error, so the list is collected first and an empty one ends the job
          # quietly — that is what failed both runs this workflow has had.
          shopt -s globstar nullglob
          documents=(reports/**/*.docx)

          if [ ${#documents[@]} -eq 0 ]; then
            echo "No finished report in this push — nothing to build."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${documents[@]}"

          # A document is reproducible: rebuilding an unchanged report gives
          # back the same bytes, and there is then nothing to commit.
          if git diff --cached --quiet; then
            echo "The documents are unchanged."
            exit 0
          fi

          git commit -m "Reports: build .docx [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
